services:
  auction-monitor:
    build: .
    container_name: auction-monitor
    # Use nordlynx container as network interface (assumes that container exists and is running)
    network_mode: "container:nordlynx"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      LOG_LEVEL: INFO
    restart: unless-stopped

# NOTE: Nordlynx container runs independently; bring it up first from its own compose file.
# No depends_on because this is an external container reference.
